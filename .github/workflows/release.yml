name: Release

# One GitHub Release per version tag (e.g. 2.1.1), covering both GPUZIP flavours:
#  - Python: GPUZIPy manylinux CUDA 12 wheels (no GPU needed to compile) + sdist.
#  - C++: the header-only library (src/) and the standalone example, as a tarball.
# PRs touching the Python bindings and manual runs only build; wheels are kept as
# workflow artifacts.
#
# To release: set `version` in GPUZIPy/setup.py, merge, then
#   git tag 2.1.1 && git push origin 2.1.1
# The tag must match the setup.py version. Python users install with:
#   pip install gpuzipy --only-binary gpuzipy \
#     --find-links https://github.com/LSC-Unicamp/GPUZIP/releases/expanded_assets/<tag>

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "GPUZIPy/**"
      - "src/Compressor/**"
      - ".github/workflows/release.yml"
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches GPUZIPy/setup.py version
        run: |
          version=$(grep -oP '^\s*version="\K[^"]+' GPUZIPy/setup.py)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match GPUZIPy/setup.py version $version"
            exit 1
          fi

  wheels:
    name: Wheel ${{ matrix.python }}
    needs: [check-version]
    # check-version is skipped on PRs/manual runs; build anyway unless it failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312, cp313]
    steps:
      - uses: actions/checkout@v4

      # cibuildwheel copies the whole repo into the container; GPUZIPy's CMake build
      # reads ../src/Compressor from there.
      - uses: pypa/cibuildwheel@v2.23.3
        with:
          package-dir: GPUZIPy
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.python }}-manylinux_x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python }}
          path: wheelhouse/*.whl

  sdist:
    needs: [check-version]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist --outdir dist GPUZIPy
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  cpp:
    needs: [check-version]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package header-only C++ library
        run: |
          mkdir -p dist
          git archive --prefix="gpuzip-$GITHUB_REF_NAME/" \
            -o "dist/gpuzip-$GITHUB_REF_NAME-cpp.tar.gz" \
            HEAD src standalone-example LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: cpp
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, sdist, cpp]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Python (GPUZIPy)
            Prebuilt CUDA 12 wheels for Linux x86_64, Python 3.10-3.13 (GPUs sm_70 to sm_90):
            ```sh
            pip install gpuzipy --only-binary gpuzipy \
                --find-links https://github.com/${{ github.repository }}/releases/expanded_assets/${{ github.ref_name }}
            ```

            ## C++ (header-only)
            `gpuzip-${{ github.ref_name }}-cpp.tar.gz` contains the library (`src/`) and the
            standalone example. Add `src/Compressor/include` and/or `src/Prefetch/include` to
            your include path.
